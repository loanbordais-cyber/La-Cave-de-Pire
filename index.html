<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cave de Piré – Stock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#2a1f22;--mut:#7a6a6e;--ac:#7b1e3a;--acx:#fff;--bd:#e7dfdc;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--ok:#166534;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1416;--card:#261d20;--tx:#f3eaec;--mut:#a89599;--ac:#d4607f;--acx:#1a1416;--bd:#3a2d31;--warn:#fbbf24;--warnbg:#3a2c0b;--bad:#fca5a5;--badbg:#3f1515;--ok:#86efac}}
:root[data-theme="dark"]{--bg:#1a1416;--card:#261d20;--tx:#f3eaec;--mut:#a89599;--ac:#d4607f;--acx:#1a1416;--bd:#3a2d31;--warn:#fbbf24;--warnbg:#3a2c0b;--bad:#fca5a5;--badbg:#3f1515;--ok:#86efac}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 14px 90px}
h1{font-size:18px;margin:6px 0 10px}
.alert{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px;cursor:pointer}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert ul{margin:6px 0 0;padding-left:18px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:14px 0;font-size:15px;font-weight:600}
nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
button.p{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;width:100%}
button.s{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 12px;font:inherit}
button.q{width:34px;flex:none;padding:6px}
#reader{width:100%;border-radius:10px;overflow:hidden;margin-bottom:8px}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;font-size:14px}
.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.loc{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.loc span{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:3px 8px;font-size:13px}
.tag{font-size:12px;border-radius:6px;padding:2px 6px;margin-left:6px}
.tag.w{background:var(--warnbg);color:var(--warn)}.tag.b{background:var(--badbg);color:var(--bad)}
.mut{color:var(--mut);font-size:13px}
.hide{display:none}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#msg.on{opacity:1}
</style>
</head>
<body>
<main>
<h1>🍷 Cave de Piré</h1>
<div id="alert"></div>
<div id="off" class="card hide">Connexion à la base indisponible. Ouvre la page depuis ton compte Claude pour que le stock soit partagé.</div>

<section id="v-vente">
  <div class="seg" id="modes">
    <button data-m="vente" class="on">Vente</button>
    <button data-m="reception">Réception</button>
    <button data-m="transfert">Transfert</button>
  </div>
  <div class="row" style="margin-bottom:8px">
    <div><label id="lblA" style="margin-top:0">Retirer de</label><select id="selA"></select></div>
    <div id="boxB" class="hide"><label style="margin-top:0">Vers</label><select id="selB"></select></div>
  </div>
  <div id="reader" class="hide"></div>
  <button class="p" id="camBtn">📷 Activer le scan</button>
  <button class="s" id="photoBtn" style="width:100%;margin-top:8px">Scanner via l’appareil photo du téléphone</button>
  <input type="file" id="photoIn" accept="image/*" capture="environment" class="hide"><div id="hid" class="hide"></div>
  <div class="card" style="margin-top:10px">
    <label style="margin-top:0">Pas de code ? Chercher à la main</label>
    <input id="manual" placeholder="Nom du vin…" autocomplete="off">
    <div id="manRes"></div>
  </div>
  <div id="pending"></div>
  <button class="p" id="validate">Valider</button>
</section>

<section id="v-stock" class="hide">
  <div class="seg" id="chips"></div>
  <input id="q" placeholder="Rechercher un vin (il en reste ? où ?)" autocomplete="off">
  <div id="addEx" class="card hide" style="margin-top:10px"><label id="exLbl" style="margin-top:0"></label><input id="ex" placeholder="Nom d’un produit déjà créé…" autocomplete="off"><div id="exRes"></div></div>
  <button class="s" id="addBtn" style="margin:10px 0;width:100%">+ Nouveau produit</button>
  <div id="form" class="card hide"></div>
  <div id="list"></div>
</section>
</main>

<nav>
  <button id="t-vente" class="on">Vente</button>
  <button id="t-stock">Stock</button>
</nav>
<div id="msg"></div>

<script>
const LOCS=[["cave","Cave"],["reserve","Réserve"],["soussol","Sous-sol"]];
const LN=Object.fromEntries(LOCS);
let col=null,products={},pending=[],mode="vente",scanner=null,lastCode="",lastT=0,editing=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tot=p=>LOCS.reduce((n,[k])=>n+(+p.stock?.[k]||0),0);
function toast(t){const m=$("msg");m.textContent=t;m.classList.add("on");setTimeout(()=>m.classList.remove("on"),1800)}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},120)}catch(e){}}

/* Navigation */
function tab(t){$("v-vente").classList.toggle("hide",t!=="vente");$("v-stock").classList.toggle("hide",t!=="stock");
$("t-vente").classList.toggle("on",t==="vente");$("t-stock").classList.toggle("on",t==="stock");if(t!=="vente")stopCam()}
$("t-vente").onclick=()=>tab("vente");$("t-stock").onclick=()=>tab("stock");

/* Sélecteurs d'emplacement */
const opts=LOCS.map(([k,n])=>`<option value="${k}">${n}</option>`).join("");
$("selA").innerHTML=opts;$("selB").innerHTML=opts;$("selB").value="reserve";
function setMode(m){mode=m;document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
$("lblA").textContent=m==="vente"?"Retirer de":m==="reception"?"Ajouter dans":"De";
$("boxB").classList.toggle("hide",m!=="transfert");
if(m==="transfert"){$("selA").value="reserve";$("selB").value="cave"}else $("selA").value="cave";
$("validate").textContent=m==="vente"?"Valider les ventes":m==="reception"?"Valider la réception":"Valider le transfert"}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));

/* Alertes */
function renderAlert(){
  const low=Object.values(products).filter(p=>tot(p)<=(+p.threshold||0));
  if(!low.length){$("alert").innerHTML="";return}
  low.sort((a,b)=>tot(a)-tot(b));
  const bad=low.some(p=>tot(p)===0);
  $("alert").innerHTML=`<div class="alert ${bad?"bad":""}" onclick="this.querySelector('ul').classList.toggle('hide')">⚠ ${low.length} produit${low.length>1?"s":""} bientôt en rupture <span class="mut">(toucher pour voir)</span><ul class="hide">${low.map(p=>`<li>${esc(p.name)} : ${tot(p)} restante${tot(p)>1?"s":""}${p.ordered?` · commandé (${esc(p.ordered)})`:""}</li>`).join("")}</ul></div>`;
}

/* Scan */
async function startCam(){
  if(!window.Html5Qrcode){toast("Scanner indisponible");return}
  $("reader").classList.remove("hide");$("camBtn").textContent="⏹ Arrêter le scan";
  try{
    scanner=new Html5Qrcode("reader");
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:110}},onCode,()=>{});
  }catch(e){toast("Caméra bloquée ici : utilise le scan via l’appareil photo");stopCam()}
}
$("photoBtn").onclick=()=>$("photoIn").click();
$("photoIn").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const h=new Html5Qrcode("hid");const r=await h.scanFile(f,false);try{h.clear()}catch(x){}onCode(r)}
  catch(x){toast("Code non lu, rapproche-toi et réessaie")}
};
async function stopCam(){
  try{if(scanner){await scanner.stop();scanner.clear()}}catch(e){}
  scanner=null;$("reader").classList.add("hide");$("camBtn").textContent="📷 Activer le scan"}
$("camBtn").onclick=()=>scanner?stopCam():startCam();
function onCode(code){
  const now=Date.now();if(code===lastCode&&now-lastT<1500)return;lastCode=code;lastT=now;
  const p=Object.values(products).find(x=>x.ean===code);
  if(p){addPending(p.id);beep()}
  else{beep();toast("Code inconnu : "+code);stopCam();tab("stock");openForm({ean:code})}
}
function addPending(id){const it=pending.find(x=>x.id===id);it?it.qty++:pending.push({id,qty:1});renderPending()}
function renderPending(){
  $("pending").innerHTML=pending.length?`<div class="card">${pending.map((it,i)=>`<div class="row" style="margin:4px 0"><div style="flex:3">${esc(products[it.id]?.name)}</div>
  <button class="s q" onclick="chg(${i},-1)">−</button><b style="flex:none;width:24px;text-align:center">${it.qty}</b><button class="s q" onclick="chg(${i},1)">+</button></div>`).join("")}</div>`:`<p class="mut">Aucun article scanné.</p>`;
}
function chg(i,d){pending[i].qty+=d;if(pending[i].qty<=0)pending.splice(i,1);renderPending()}
$("manual").oninput=e=>{
  const v=e.target.value.trim().toLowerCase();
  $("manRes").innerHTML=v?Object.values(products).filter(p=>p.name.toLowerCase().includes(v)).slice(0,5).map(p=>`<button class="s" style="width:100%;text-align:left;margin-top:6px" onclick="addPending('${p.id}');$('manual').value='';$('manRes').innerHTML=''">${esc(p.name)} <span class="mut">(${tot(p)})</span></button>`).join(""):"";
};
$("validate").onclick=async()=>{
  if(!pending.length||!col)return;
  const a=$("selA").value,b=$("selB").value;
  if(mode==="transfert"&&a===b){toast("Choisis deux lieux différents");return}
  try{
    for(const it of pending){
      const p=products[it.id];if(!p)continue;const s={...p.stock};
      if(mode!=="reception")s[a]=Math.max(0,(+s[a]||0)-it.qty);
      if(mode==="reception")s[a]=(+s[a]||0)+it.qty;
      if(mode==="transfert")s[b]=(+s[b]||0)+it.qty;
      const upd={stock:s};if(mode==="reception")upd.ordered="";
      await col.doc(p.id).update(upd);
    }
    pending=[];renderPending();toast("Enregistré ✔");
  }catch(e){toast("Erreur d’enregistrement")}
};

/* Stock */
let locF="all";
function setLoc(k){locF=k;renderChips();$("addEx").classList.toggle("hide",k==="all");if(k!=="all")$("exLbl").textContent="Ajouter 1 bouteille en "+LN[k]+" (produit existant)";renderList()}
function renderChips(){$("chips").innerHTML=[["all","Tout"],...LOCS].map(([k,n])=>`<button class="${k===locF?"on":""}" onclick="setLoc('${k}')">${n}</button>`).join("")}
async function adj(id,d){const p=products[id];if(!p||!col)return;const s={...p.stock};s[locF]=Math.max(0,(+s[locF]||0)+d);try{await col.doc(id).update({stock:s})}catch(e){toast("Erreur")}}
$("ex").oninput=e=>{const v=e.target.value.trim().toLowerCase();$("exRes").innerHTML=v?Object.values(products).filter(p=>p.name.toLowerCase().includes(v)).slice(0,5).map(p=>`<button class="s" style="width:100%;text-align:left;margin-top:6px" onclick="adj('${p.id}',1);toast('+1 en '+LN[locF])">${esc(p.name)} <span class="mut">(${LN[locF]} : ${+p.stock?.[locF]||0})</span></button>`).join(""):""};
function renderList(){
  const v=$("q").value.trim().toLowerCase();
  const arr=Object.values(products).filter(p=>(!v||p.name.toLowerCase().includes(v)||(p.ean||"").includes(v))&&(locF==="all"||(+p.stock?.[locF]||0)>0)).sort((a,b)=>a.name.localeCompare(b.name));
  $("list").innerHTML=arr.length?arr.map(p=>{const t=tot(p);
    const tg=t===0?'<span class="tag b">rupture</span>':t<=(+p.threshold||0)?'<span class="tag w">stock bas</span>':"";
    return `<div class="card" onclick="openForm('${p.id}')"><b>${esc(p.name)}</b>${tg}<div class="mut">Total : ${t}${p.price?` · ${esc(p.price)} €`:""}${p.ordered?` · 📦 ${esc(p.ordered)}`:""}</div>
    ${locF==="all"?`<div class="loc">${LOCS.map(([k,n])=>`<span>${n} : ${+p.stock?.[k]||0}</span>`).join("")}</div>`:`<div class="row" style="margin-top:8px"><span style="flex:2">${LN[locF]} : <b>${+p.stock?.[locF]||0}</b></span><button class="s q" onclick="event.stopPropagation();adj('${p.id}',-1)">−</button><button class="s q" onclick="event.stopPropagation();adj('${p.id}',1)">+</button></div>`}</div>`}).join(""):`<p class="mut">Aucun produit${v?" trouvé":" pour l’instant"}.</p>`;
}
$("q").oninput=renderList;
$("addBtn").onclick=()=>openForm(locF==="all"?{}:{stock:{[locF]:1}});
function openForm(x){
  const p=typeof x==="string"?products[x]:x;editing=p.id||null;
  const f=$("form");f.classList.remove("hide");
  f.innerHTML=`<label style="margin-top:0">Nom</label><input id="f_name" value="${esc(p.name)}">
  <label>Code-barres (EAN)</label><input id="f_ean" inputmode="numeric" value="${esc(p.ean)}">
  <div class="row"><div><label>Prix (€)</label><input id="f_price" inputmode="decimal" value="${esc(p.price)}"></div>
  <div><label>Alerte à partir de</label><input id="f_thr" inputmode="numeric" value="${p.threshold??3}"></div></div>
  <div class="row">${LOCS.map(([k,n])=>`<div><label>${n}</label><input id="f_${k}" inputmode="numeric" value="${+p.stock?.[k]||0}"></div>`).join("")}</div>
  <label>Commande en cours (ex. « 12 bouteilles, jeudi »)</label><input id="f_ord" value="${esc(p.ordered)}">
  <div class="row" style="margin-top:12px"><button class="p" onclick="saveForm()">Enregistrer</button><button class="s" onclick="$('form').classList.add('hide')">Annuler</button>
  ${editing?`<button class="s" style="color:var(--bad)" onclick="delProd()">Supprimer</button>`:""}</div>`;
  f.scrollIntoView({behavior:"smooth"});
}
async function saveForm(){
  const name=$("f_name").value.trim();if(!name){toast("Le nom est obligatoire");return}
  const ean=$("f_ean").value.trim();
  const stock={};LOCS.forEach(([k])=>stock[k]=Math.max(0,parseInt($("f_"+k).value)||0));
  const data={name,ean,price:$("f_price").value.trim(),threshold:parseInt($("f_thr").value)||0,stock,ordered:$("f_ord").value.trim()};
  try{
    if(editing)await col.doc(editing).update(data);
    else{const r=col.doc();await r.set(data)}
    $("form").classList.add("hide");toast("Produit enregistré ✔");
  }catch(e){toast("Erreur d’enregistrement")}
}
async function delProd(){if(editing&&confirm("Supprimer ce produit ?")){try{await col.doc(editing).delete();$("form").classList.add("hide")}catch(e){toast("Erreur")}}}

/* Base de données partagée */
(async()=>{
  setMode("vente");renderPending();renderChips();renderList();
  try{
    const db=await claude.use("db");
    if(!db){$("off").classList.remove("hide");return}
    col=db.collection("products");
    col.onSnapshot(s=>{products={};s.docs.forEach(d=>{products[d.id]={id:d.id,...d.data()}});renderAlert();renderList();renderPending()},()=>$("off").classList.remove("hide"));
  }catch(e){$("off").classList.remove("hide")}
})();
</script>
</body>
</html>
